<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Delete Resource | EduShare</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;

            background: #f5f7fb;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;
        }

        .container {
            width: 450px;

            background: white;

            padding: 35px;

            border-radius: 12px;

            text-align: center;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #dc2626;

            margin-bottom: 15px;
        }

        p {
            color: #555;

            line-height: 1.6;

            margin-bottom: 25px;
        }

        .actions {
            display: flex;

            gap: 12px;

            justify-content: center;
        }

        button,
        a {
            padding: 11px 20px;

            border-radius: 6px;

            text-decoration: none;

            font-size: 14px;

            cursor: pointer;
        }

        button {
            border: none;

            background: #dc2626;

            color: white;
        }

        .cancel {
            background: #e5e7eb;

            color: #333;
        }

    </style>

</head>


<body>

    <div class="container">

        <h1>
            Delete Resource?
        </h1>

        <p>

            Are you sure you want to delete

            <strong>
                "{{ material.title }}"
            </strong>?

            <br><br>

            This action cannot be undone.

        </p>


        <div class="actions">

            <form method="POST">

                {% csrf_token %}

                <button type="submit">
                    Yes, Delete
                </button>

            </form>


            <a
                href="{% url 'material_detail' material.pk %}"
                class="cancel"
            >
                Cancel
            </a>

        </div>

    </div>

</body>

</html>
